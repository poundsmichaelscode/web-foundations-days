<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <script src="users.js" defer></script>
</head>
<body>

  <header>
    <h1>User Directory</h1>
  </header>

  <main>
    <section>
      <button id="load-users" type="button">Load Users</button>

      <p>
        <label for="filter-input">Filter users by name:</label>
      </p>

      <input
        id="filter-input"
        type="text"
        placeholder="Type a name..."
      >

      <p id="status">Click "Load Users" to begin.</p>

      <ul id="users-list"></ul>
    </section>
  </main>

</body>
</html>
