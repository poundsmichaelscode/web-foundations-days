<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes Editor</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main>
    <section class="note-app">
      <h1>QuickNotes Editor</h1>

      <label for="note-text">Write your note</label>

      <textarea
        id="note-text"
        rows="10"
        placeholder="Start typing your note..."
      ></textarea>

      <div class="counts">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="buttons">
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Dark mode</button>
      </div>
    </section>
  </main>

</body>
</html>
